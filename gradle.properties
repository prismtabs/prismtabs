# --- Plugin identity -------------------------------------------------------
# Change pluginGroup to your own reverse-domain before publishing anywhere.
pluginGroup = io.prismtabs
pluginName = PrismTabs
pluginVersion = 1.4.18

# --- Compatibility ---------------------------------------------------------
# Compile baseline. 242 == IntelliJ IDEA 2024.2, which requires JDK 21.
# Dropping to 231 (2023.1) widens support but forces a JDK 17 toolchain.
platformVersion = 2024.2
pluginSinceBuild = 242

# --- Build behaviour -------------------------------------------------------
# The platform bundles the Kotlin stdlib. Bundling our own causes conflicts.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
