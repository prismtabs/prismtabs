# --- Plugin identity -------------------------------------------------------
# Change pluginGroup to your own reverse-domain before publishing anywhere.
pluginGroup = io.prismtabs
pluginName = PrismTabs
pluginVersion = 1.4.15

# --- Compatibility ---------------------------------------------------------
# Compile baseline. 251 == IntelliJ IDEA 2025.1, which requires JDK 21.
# Not lower: from 251 the JetBrains Marketplace Licensing plugin (com.intellij.marketplace) is a
# plugin PrismTabs can depend on in every IDE, which is what stops the paid-feature gate failing
# open where it is not bundled (Android Studio). 2024.2-2024.3 paid IDEs build it into the core
# instead, so the dependency cannot resolve there - see README "How the licence check works".
platformVersion = 2025.1
pluginSinceBuild = 251

# --- Build behaviour -------------------------------------------------------
# The platform bundles the Kotlin stdlib. Bundling our own causes conflicts.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
