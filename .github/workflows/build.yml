name: Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    # Cross-platform matrix: `build` (compile + the plain-JUnit `test` suite) is pure JVM/Swing
    # code with no native or OS-specific paths, so this is what actually proves the plugin's logic
    # behaves the same on macOS and Windows, not just Linux. It deliberately does NOT cover
    # `uiTest` (the remote-robot suite) — that drives a real java.awt.Robot against a real desktop
    # session, which none of these runners provide identically (see README "UI testing" and "These
    # tests need an X11 display" for what that actually takes even on Linux). Windows has a manual-
    # trigger-only workflow for that instead (`ui-tests.yml`); macOS remains a manual pass on real
    # hardware — see docs/cross-platform-manual-verification.md for why.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # `windows-latest`'s default `run:` shell is PowerShell, which cannot execute `./gradlew`
      # (a POSIX shell script) — `shell: bash` forces Git Bash, preinstalled on that runner, so
      # the same invocation works unmodified on all three OSes.
      - run: ./gradlew build
        shell: bash

  verify-plugin:
    # verifyPlugin is a static bytecode/API-compatibility check against downloaded IDE
    # distributions — its result cannot vary by host OS, so it runs once here rather than three
    # times in the matrix above (each run downloads the full IU verification matrix; tripling that
    # for an OS-independent check would only burn CI minutes).
    #
    # One job per IDE release branch. All eight IDEs in one job need roughly 45-50 GB of downloads
    # and extracted installs, and a hosted runner has about 14 GB free, so a single job dies with
    # "No space left on device" and leaves no log. Split, each job holds one IDE and a failure
    # names the IDE that broke. -PverifyIdeBranch narrows build.gradle.kts's selection to one
    # branch. Add a branch here when JetBrains ships a new major release: verifyPlugin run
    # locally with no property prints the full list in its "about to resolve" line.
    strategy:
      fail-fast: false
      matrix:
        ide-branch: [ '242', '243', '251', '252', '253', '261', '262', '263' ]
    name: verify-plugin (${{ matrix.ide-branch }})
    runs-on: ubuntu-latest
    steps:
      # Kept as headroom: a single recent IDE is still several GB extracted, next to its archive.
      # The JDK is untouched because setup-java installs its own.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyPlugin -PverifyIdeBranch=${{ matrix.ide-branch }}
