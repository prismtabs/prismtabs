name: UI Tests

# Manual only, deliberately: driving java.awt.Robot needs a real interactive desktop, and Windows
# runner minutes carry a 2x plan-minute multiplier — not something to spend on every push.
#
# This is a DEBUGGING AID, NOT A RELEASE GATE. Tried end to end on 2026-09-08: the suite does not
# pass on a GitHub-hosted `windows-latest` runner — two back-to-back runs failed identically, 12 of
# 43, with the tool-window-tree assertions in TabGroupsToolWindowUiTest and PaywallUiTest timing
# out. The likely cause is that the hosted runner's session is not the real interactive desktop
# remote-robot's java.awt.Robot needs (RemoteRobotExtension's frame de-iconify/raise workaround is
# calibrated to a real local session and does not carry over), but that has not been confirmed from
# the sandbox log yet — which is what the artifact paths below now capture. It has never passed on a
# hosted runner. The Windows verification that actually counts is a local `./gradlew uiTest` on real
# hardware plus docs/cross-platform-manual-verification.md. See README "UI testing".
on:
  workflow_dispatch:

jobs:
  ui-tests:
    # Windows only — macOS was evaluated and rejected: remote-robot needs Screen Recording/
    # Accessibility TCC permission, and every current GitHub-hosted macOS image (14+) runs with SIP
    # enabled and no supported way to pre-grant that non-interactively. Direct TCC.db writes are
    # SIP-blocked; the one documented community workaround needed SIP disabled, true only for the
    # now-retired macOS 13 image (actions/runner-images#9529, actions/runner-images#7792). macOS UI
    # verification stays a manual pass on real hardware — see docs/cross-platform-manual-verification.md.
    #
    # Re-check date: this finding is image-specific, evaluated 2026-08-10 against macOS 14/15
    # hosted runners. Before trusting it again, re-verify GitHub's hosted-macOS TCC/SIP posture
    # hasn't changed — don't extend this matrix to macOS on the strength of a template example or a
    # third-party writeup alone; confirm a real Screen Recording/Accessibility grant path exists
    # non-interactively on the then-current image first.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      # Same pattern as local dev (README "UI testing"): a long-lived IDE process backgrounded in
      # its own step, polled for readiness in the next one, then driven from the one after that.
      - name: Start sandbox IDE (runIdeForUiTests)
        run: ./gradlew runIdeForUiTests &
        shell: bash

      - name: Wait for robot-server on :8082
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8082 > /dev/null; then
              echo "robot-server is up"
              exit 0
            fi
            sleep 10
          done
          echo "robot-server never came up after 10 minutes" >&2
          exit 1
        shell: bash

      - name: Run UI tests
        # No --tests include list needed: every uiTest class that shouldn't run unattended
        # self-gates with a JUnit `assumeTrue` instead — MacSettingsShortcutUiTest to macOS,
        # WindowsManualVerificationUiTest to an explicit -Dprismtabs.manualVerification=true this
        # workflow never passes (see both classes' doc comments and README "UI testing"). A bare
        # `uiTest` run therefore always executes exactly the automated classes and needs no upkeep
        # when a new one is added.
        run: ./gradlew uiTest
        shell: bash

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports-windows
          # The Gradle HTML report is only half the picture on a hosted-runner failure. The two
          # paths that actually let you diagnose one:
          #   - build/reports/*.png    — RemoteRobotExtension.afterTestExecution paints one per
          #                              failed test, named after the method, straight into
          #                              build/reports (not under tests/uiTest). Without this line
          #                              they were generated and thrown away.
          #   - .intellijPlatform/sandbox/**/log*/idea.log — the sandbox IDE's own log; grep it for
          #                              an `io.prismtabs` frame to tell a real plugin failure from
          #                              the expected GradleJvmSupportMatrix noise (README "UI
          #                              testing" → "Expected sandbox noise").
          path: |
            build/reports/tests/uiTest
            build/reports/manual
            build/reports/*.png
            .intellijPlatform/sandbox/**/log*/idea.log
          retention-days: 14
